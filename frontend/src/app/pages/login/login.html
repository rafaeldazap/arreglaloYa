<div class="contenedor-chico">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <form (ngSubmit)="ingresar()">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" [(ngModel)]="correo" placeholder="tucorreo@gmail.com" required />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required />
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="btn btn-bloque" type="submit" style="margin-top: 18px" [disabled]="cargando()">{{ cargando() ? 'Ingresando...' : 'Ingresar' }}</button>
    </form>
    <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
