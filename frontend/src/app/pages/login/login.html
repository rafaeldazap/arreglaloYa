<div class="contenedor-chico">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <form (ngSubmit)="ingresar()">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" [(ngModel)]="correo" placeholder="tucorreo@gmail.com" required />
      <label for="password">Contraseña</label>
      <div style="display: flex; gap: 8px">
        <input #campoPassword id="password" name="password" type="password" [(ngModel)]="password" required style="flex: 1; min-width: 0" />
        <button class="btn btn-secundario" type="button" (click)="campoPassword.type = campoPassword.type === 'password' ? 'text' : 'password'">{{ campoPassword.type === 'password' ? 'Mostrar' : 'Ocultar' }}</button>
      </div>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="btn btn-bloque" type="submit" style="margin-top: 18px" [disabled]="cargando()">{{ cargando() ? 'Ingresando...' : 'Ingresar' }}</button>
    </form>
    <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    @if (auth.esDemo) {
      <div class="cuentas-demo">
        <b>Cuentas de prueba</b> (contraseña <code>123456</code>)
        @for (c of auth.cuentasDemo; track c.correo) {
          <button type="button" (click)="correo = c.correo; password = '123456'">{{ c.rol === 'ADMIN' ? 'Administrador' : c.rol === 'TRABAJADOR' ? 'Trabajador' : 'Cliente' }}: {{ c.correo }}</button>
        }
      </div>
    }
  </div>
</div>
